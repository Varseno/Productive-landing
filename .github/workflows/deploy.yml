name: Deploy Productive Landing to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -e

            cd /www/wwwroot/productive-landing

            echo "Fetching latest code..."
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            echo "Restarting Productive Landing..."
            pm2 restart productive-landing
            pm2 save

            echo "Waiting for application health check..."
            for i in $(seq 1 10); do
              if curl -fsS --max-time 3 http://127.0.0.1:3003/ -o /dev/null; then
                echo "Productive Landing deployed and verified successfully"
                exit 0
              fi

              echo "Attempt $i failed; retrying in 2 seconds..."
              sleep 2
            done

            echo "Productive Landing health check failed"
            pm2 status productive-landing
            pm2 logs productive-landing --lines 50 --nostream
            exit 1
